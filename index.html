  .pv-final-label{font-size:12px; font-weight:700; letter-spacing:0; text-transform:none; color:var(--accent); margin-bottom:8px;}
  .pv-lm-grid{display:grid; row-gap:10px; column-gap:16px; align-items:center; padding:4px 2px; position:relative; z-index:1;}
  .pv-lm-cell{min-height:32px; display:flex; align-items:center;}
  .pv-empty{padding:24px; text-align:center; color:var(--text-dim); font-size:14px;}
  @media (prefers-color-scheme: dark){
    :root{ --bg:#11131c; --surface:#181b29; --border:#2d3146; --text:#e7e9f2; --text-dim:#9a9fb8; --accent:#9b8cf2;
      --idea-yellow-bg:#5c4b05; --idea-yellow-text:#ffe79a; --idea-blue-bg:#17335c; --idea-blue-text:#a8caff;
      --idea-green-bg:#1f3d20; --idea-green-text:#9fe6a0; --idea-red-bg:#4a1f1f; --idea-red-text:#ffb3b3; }
    .pv-chip{background:#242744;}
  }
</style></head>
<body>
  <h1>Linear Thinking — kết quả đoạn văn</h1>
  <p class="sub">Bản xem kết quả (chỉ xem, không chỉnh sửa được).</p>
  <div class="toolbar">
    <button class="pv-btn" id="t-recap">Ẩn câu gốc</button>
    <button class="pv-btn" id="t-hidesimplified">Ẩn Simplified</button>
    <button class="pv-btn" id="t-linear">Linear Model</button>
  </div>
  <div id="root"></div>
<script>
(function(){
  var DATA = ${dataStr};
  var view = { recap:false, hideSimplified:false, linear:false };
  var root = document.getElementById("root");

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function renderNormal(){
    var html = '<div class="pv-wrap" id="pv-wrap"><svg class="pv-svg" id="pv-svg"></svg>';
    DATA.sentences.forEach(function(s){
      html += '<div class="pv-row">';
      html += '<span class="pv-num">'+s.number+'</span>';
      if(!view.recap) html += '<span class="pv-sentence">'+esc(s.text)+'</span>';
      if(s.checked){
        if(!view.hideSimplified){
          var chips = s.simplifiedChips.length
            ? s.simplifiedChips.map(function(c){ return '<span class="pv-chip">'+esc(c)+'</span>'; }).join("")
            : '<span style="color:var(--text-dim);">(chưa bôi phần nào)</span>';
          html += '<div class="pv-simplified"><span class="pv-simplified-label">Simplified</span>'+chips+'</div>';
        }
        if(s.boxes.length){
          var pills = s.boxes.map(function(b){ return '<span class="pv-pill '+b.color+'" data-box-id="'+esc(b.id)+'">'+esc(b.text)+'</span>'; }).join("");
          html += view.hideSimplified
            ? '<div class="pv-mi-row"><span class="pv-mi-label">Main idea</span>'+pills+'</div>'
            : '<div class="pv-mi-row"><span class="pv-mi-label">Main idea</span>'+pills+'</div>';
        }
      }
      html += '</div>';
    });
    if(DATA.finalBoxes.length){
      var fpills = DATA.finalBoxes.map(function(b){ return '<span class="pv-pill '+b.color+'">'+esc(b.text)+'</span>'; }).join(" ");
      html += '<div class="pv-final"><div class="pv-final-label">Main Idea (cả đoạn)</div>'+fpills+'</div>';
    }
    html += '</div>';
    root.innerHTML = html;
    requestAnimationFrame(drawConnections);
  }

  function renderLinear(){
    var rows = DATA.sentences.filter(function(s){ return s.checked && s.boxes.length; });
    if(rows.length===0){
      root.innerHTML = '<div class="pv-empty">Chưa có câu nào được simplify + điền Main Idea.</div>';
      return;
    }
    var parent = {};
    function find(x){ parent[x] = (parent[x]===undefined)?x:parent[x]; while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
    function union(a,b){ var ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; }
    rows.forEach(function(r){ r.boxes.forEach(function(b){ find(b.id); }); });
    DATA.connections.forEach(function(c){
      if(parent[c.aBoxId]===undefined) parent[c.aBoxId]=c.aBoxId;
      if(parent[c.bBoxId]===undefined) parent[c.bBoxId]=c.bBoxId;
      union(c.aBoxId, c.bBoxId);
    });
    var colOfRoot = new Map();
    rows.forEach(function(r){ r.boxes.forEach(function(b){ var rt=find(b.id); if(!colOfRoot.has(rt)) colOfRoot.set(rt, colOfRoot.size); }); });
    var colCount = Math.max(1, colOfRoot.size);

    var html = '<div class="pv-wrap" id="pv-wrap"><svg class="pv-svg" id="pv-svg"></svg>';
    html += '<div class="pv-lm-grid" style="grid-template-columns:26px repeat('+colCount+', minmax(70px, max-content));">';
    rows.forEach(function(r){
      var cellsByCol = new Array(colCount).fill(null);
      r.boxes.forEach(function(b){ var col = colOfRoot.get(find(b.id)); if(cellsByCol[col]===null) cellsByCol[col]=b; });
      html += '<span class="pv-num">'+r.number+'</span>';
      for(var col=0; col<colCount; col++){
        var b = cellsByCol[col];
        html += '<div class="pv-lm-cell">'+(b ? '<span class="pv-pill '+b.color+'" data-box-id="'+esc(b.id)+'">'+esc(b.text)+'</span>' : '')+'</div>';
      }

    if(DATA.finalBoxes.length){
      var fpills2 = DATA.finalBoxes.map(function(b){ return '<span class="pv-pill '+b.color+'">'+esc(b.text)+'</span>'; }).join(" ");
      html += '<div class="pv-final"><div class="pv-final-label">Main Idea (cả đoạn)</div>'+fpills2+'</div>';
    }
    html += '</div>';
    root.innerHTML = html;
    requestAnimationFrame(drawConnections);

  function drawConnections(){
    var wrap = document.getElementById("pv-wrap");
    var svg = document.getElementById("pv-svg");
    if(!wrap || !svg) return;
    var w = wrap.scrollWidth, h = wrap.scrollHeight;
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.setAttribute("viewBox", "0 0 "+w+" "+h);
    var wrapRect = wrap.getBoundingClientRect();
    var paths = DATA.connections.map(function(c){
      var aEl = wrap.querySelector('[data-box-id="'+CSS.escape(c.aBoxId)+'"]');
      var bEl = wrap.querySelector('[data-box-id="'+CSS.escape(c.bBoxId)+'"]');
      if(!aEl || !bEl) return "";
      var ar = aEl.getBoundingClientRect(), br = bEl.getBoundingClientRect();
      var x1 = ar.left - wrapRect.left + ar.width/2, y1 = ar.bottom - wrapRect.top;
      var x2 = br.left - wrapRect.left + br.width/2, y2 = br.top - wrapRect.top;
      var midY = (y1+y2)/2;
      return '<path d="M '+x1+' '+y1+' C '+x1+' '+midY+', '+x2+' '+midY+', '+x2+' '+y2+'" class="pv-conn-line"/>';
    }).join("");
    svg.innerHTML = paths;
  }

  async function addParagraph(text){
    text = (text||"").trim();
    if(!text){ toast("Bạn chưa dán đoạn văn."); return; }
    const sentencesArr = splitSentencesLocal(text).map(t=>({ text: t, selected: [], checked: false, mainIdeaBoxes: ["",""] }));
    if(sentencesArr.length===0){ toast("Không tách được câu nào."); return; }
    const doc = {
      text, sentences: sentencesArr,
      relationships: Array(Math.max(0, sentencesArr.length-1)).fill(""),
      connections: [], finalMainIdea: ["",""],
      uiRecap: false, uiHideSimplified: false, uiLinearModel: false,
      order: Date.now(), createdAt: Date.now()
    };
    state.paraDraftText = "";
    state.paraBulkFiles = [];
    if(state.db){

        const ref = await state.db.collection("paragraphs").add(doc);
        state.currentParagraphId = ref.id;
        state.paraRecap = false;
        renderParagraphView();
      }catch(e){ console.error(e); toast("Không lưu được đoạn này."); }
    } else {
      const id = "localp_"+(state.localIdSeq++);

  async function addQaParagraph(passageText, questionText){

    const sentencesArr = splitSentencesLocal(passageText).map(t=>({ text: t, selected: [], checked: false, mainIdeaBoxes: ["",""] }));
    const questionArr = splitSentencesLocal(questionText).map(t=>({ text: t, selected: [], checked: false, mainIdeaBoxes: ["",""] }));
    if(sentencesArr.length===0){ toast("Không tách được câu nào trong bài đọc."); return; }
    if(questionArr.length===0){ toast("Không tách được câu hỏi."); return; }
    const doc = {
      text: passageText, sentences: sentencesArr,
      relationships: Array(Math.max(0, sentencesArr.length-1)).fill(""),
      connections: [], finalMainIdea: ["",""],
      isQa: true, questionSentences: questionArr, qaNoteHtml: "",
      uiRecap: false, uiHideSimplified: false, uiLinearModel: false,
      order: Date.now(), createdAt: Date.now()
    };
    state.qaDraftPassageText = "";
    state.qaDraftQuestionText = "";

      state.paraRecap = false;
      renderParagraphView();

  function updateParagraph(id, patch){
    const p = getParagraph(id);

    if(!userIsTypingInField()) renderParagraphView();
    if(state.db){
      markLocalWrite(id);
      state.db.collection("paragraphs").doc(id).update(patch).catch(err=>{ console.error(err); });

  function deleteParagraph(id){

    if(state.db){

  function openParagraph(id){

  function updateQaQuestionSentence(pid, sidx, patch){

  function toggleQaQuestionTok(pid, sidx, tidx){
    const p = getParagraph(pid);
    const s = p && (p.questionSentences||[])[sidx];
    if(!s || s.checked) return;
    const sel = new Set(s.selected||[]);
    if(sel.has(tidx)) sel.delete(tidx); else sel.add(tidx);
    updateQaQuestionSentence(pid, sidx, { selected: Array.from(sel).sort((a,b)=>a-b) });
  }

  function toggleQaQuestionTokSplit(pid, sidx, tidx){
    const p = getParagraph(pid);
    const s = p && (p.questionSentences||[])[sidx];
    if(!s || s.checked) return;
    const sel = new Set(s.selected||[]);
    const splits = new Set(s.selSplitAfter||[]);
    if(sel.has(tidx) && sel.has(tidx+1)){
      if(splits.has(tidx)) splits.delete(tidx); else splits.add(tidx);
    } else if(sel.has(tidx-1) && sel.has(tidx)){
      const b = tidx-1;
      if(splits.has(b)) splits.delete(b); else splits.add(b);
    } else {
      toggleQaQuestionTok(pid, sidx, tidx);
      return;
    }
    updateQaQuestionSentence(pid, sidx, { selSplitAfter: Array.from(splits).sort((a,b)=>a-b) });
  }

  function toggleParaTok(pid, sidx, tidx){

    const s = p && p.sentences[sidx];
    if(!s || s.checked) return;
    const sel = new Set(s.selected||[]);

  function toggleParaTokSplit(pid, sidx, tidx){

  function toggleParaTokSecondary(pid, sidx, tidx){

  // Option/Alt+click-and-drag from the first word of a phrase to the last paints the whole range as
  // secondary in one gesture, instead of clicking every word one by one. A plain Option+click with no
  // movement still falls back to the single-word toggle. Works across both tabs: `scope` identifies
  // which sentence the drag belongs to (by single-sentence id, or by paragraph id + sentence index) so
  // the drag never bleeds into a neighboring sentence's tokens.
  let altDragState = null;

  function altDragScopeFor(el){
    // A Qa question token carries the SAME data-pid/data-sidx as its sibling passage sentence (both
    // live on the same paragraph doc) -- data-qside="q" is the only thing telling the two apart, so it
    // must be checked before the generic "has data-pid" para branch.
    if(el.dataset.qside === "q") return { kind:"qaQuestion", pid: el.dataset.pid, sidx: parseInt(el.dataset.sidx,10) };
    return el.dataset.pid !== undefined
      ? { kind:"para", pid: el.dataset.pid, sidx: parseInt(el.dataset.sidx,10) }
      : { kind:"single", id: el.dataset.id };
  }
  function altDragIdxOf(scope, el){
    return (scope.kind === "para" || scope.kind === "qaQuestion") ? parseInt(el.dataset.tidx,10) : parseInt(el.dataset.idx,10);
  }
  function altDragTokSelector(scope){
    if(scope.kind === "qaQuestion") return `.tok[data-pid="${cssEsc(scope.pid)}"][data-sidx="${scope.sidx}"][data-qside="q"]`;
    return scope.kind === "para"
      ? `.tok[data-pid="${cssEsc(scope.pid)}"][data-sidx="${scope.sidx}"]:not([data-qside])`
      : `.tok[data-id="${cssEsc(scope.id)}"]`;
  }
  function altDragScopeMatches(scope, el){
    if(scope.kind === "qaQuestion") return (el.dataset.pid === scope.pid && parseInt(el.dataset.sidx,10) === scope.sidx && el.dataset.qside === "q");
    return scope.kind === "para"
      ? (el.dataset.pid === scope.pid && parseInt(el.dataset.sidx,10) === scope.sidx && el.dataset.qside === undefined)
      : (el.dataset.id === scope.id);
  }
  function altDragRoot(scope){
    return (scope.kind === "para" || scope.kind === "qaQuestion") ? paragraphEl : singleEl;
  }
  function altDragSentenceFor(scope){
    if(scope.kind === "para"){
      const p = getParagraph(scope.pid);
      return p && p.sentences[scope.sidx];
    }
    if(scope.kind === "qaQuestion"){
      const p = getParagraph(scope.pid);
      return p && (p.questionSentences||[])[scope.sidx];
    }
    return state.sentences.find(x=>x.id===scope.id);
  }

  function startAltDrag(el){
    if(el.classList.contains("locked")) return;
    const scope = altDragScopeFor(el);
    const idx = altDragIdxOf(scope, el);
    // Starting the drag ON an already-secondary word erases the dragged range instead of painting it --
    // same gesture, same key, the start point's own state decides add vs. remove.
    const s = altDragSentenceFor(scope);
    const erase = !!(s && (s.selSecondary||[]).includes(idx));
    altDragState = { scope, startIdx: idx, lastIdx: idx, moved: false, erase };
    updateAltDragPreview();
    document.addEventListener("mousemove", onAltDragMove);
    document.addEventListener("mouseup", onAltDragUp, { once: true });
  }

  function updateAltDragPreview(){
    if(!altDragState) return;
    const { scope, startIdx, lastIdx, erase } = altDragState;
    const lo = Math.min(startIdx, lastIdx), hi = Math.max(startIdx, lastIdx);
    $$(altDragTokSelector(scope), altDragRoot(scope)).forEach(el=>{
      const idx = altDragIdxOf(scope, el);
      const inRange = idx >= lo && idx <= hi;
      el.classList.toggle("drag-preview", inRange && !erase);
      el.classList.toggle("drag-erase", inRange && erase);
    });
  }

  function onAltDragMove(e){
    if(!altDragState) return;
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const tokEl = target && target.closest ? target.closest(".tok") : null;
    if(!tokEl || !altDragScopeMatches(altDragState.scope, tokEl)) return;
    const idx = altDragIdxOf(altDragState.scope, tokEl);
    if(idx !== altDragState.lastIdx){
      altDragState.lastIdx = idx;
      altDragState.moved = true;
      updateAltDragPreview();
    }
  }

  function onAltDragUp(){
    document.removeEventListener("mousemove", onAltDragMove);
    if(!altDragState) return;
    const { scope, startIdx, lastIdx, moved, erase } = altDragState;
    $$(altDragTokSelector(scope), altDragRoot(scope)).forEach(el=> el.classList.remove("drag-preview", "drag-erase"));
    altDragState = null;

    const s = altDragSentenceFor(scope);
    if(!s || s.checked) return;
    const sel2 = new Set(s.selSecondary||[]);
    if(!moved){
      if(sel2.has(startIdx)) sel2.delete(startIdx); else sel2.add(startIdx);
    } else {
      const lo = Math.min(startIdx,lastIdx), hi = Math.max(startIdx,lastIdx);
      for(let i=lo;i<=hi;i++){ if(erase) sel2.delete(i); else sel2.add(i); }
    }
    const patch = { selSecondary: Array.from(sel2).sort((a,b)=>a-b) };
    if(scope.kind === "para") updateParaSentence(scope.pid, scope.sidx, patch);
    else if(scope.kind === "qaQuestion") updateQaQuestionSentence(scope.pid, scope.sidx, patch);
    else updateSentence(scope.id, patch);
  }

  // Bakes stable ids (and colors) onto a sentence's Main Idea boxes, generating any that are missing.
  // p.sentences[sidx] can be a frozen object straight from the realtime backend's snapshot data, so it
  // must NEVER be mutated in place -- only p's own "sentences" property (a plain, locally-owned array)
  // may be reassigned. This swaps in a fresh sentences array + sentence object holding the normalized
  // boxes, then -- only if an id actually had to be invented just now -- schedules a background write
  // so the id survives a reload instead of only existing for this render pass. Returns the normalized
  // boxes array.
  const pendingBakeFlush = new Set();
  function scheduleBakeFlush(pid){
    if(pendingBakeFlush.has(pid)) return;
    pendingBakeFlush.add(pid);
    setTimeout(()=>{
      pendingBakeFlush.delete(pid);
      const p = getParagraph(pid);
      if(!p || !state.db) return;
      markLocalWrite(pid);
      state.db.collection("paragraphs").doc(pid).update({ sentences: p.sentences }).catch(err=>{ console.error(err); });
    }, 0);
  }
  function bakeMiBoxIds(p, sidx){
    const s = p.sentences[sidx];
    if(!s) return [];
    const already = s.mainIdeaBoxes && s.mainIdeaBoxes.length &&
      s.mainIdeaBoxes.every(b => b && typeof b === "object" && b.id);
    const normalized = normMiBoxes(s.mainIdeaBoxes);
    if(!already){
      const newSentences = p.sentences.slice();
      newSentences[sidx] = Object.assign({}, s, { mainIdeaBoxes: normalized });
      p.sentences = newSentences;
      scheduleBakeFlush(p.id);
    }
    return normalized;
  }
  function ensureBoxId(p, sidx, idx){
    const arr = bakeMiBoxIds(p, sidx);
    return arr[idx] ? arr[idx].id : null;
  }

  // ---------- Main Idea box connection dots: press-and-drag to connect ----------
  // Pressing a dot starts a drag; a live dashed line follows the cursor; releasing over ANY part of
  // another sentence's Main Idea box (not just its dot precisely) links to that box automatically.
  // miDrag is a transient, non-persisted gesture — nothing is written until the drag completes on a
  // valid target, so an aborted drag (released over empty space) leaves no trace.
  let miDrag = null; // { pid, sidx, idx, x0, y0 } in viewport coordinates, while a drag is in progress

  function wireMiConnectHandles(root){
    $$(".mi-connect-handle", root).forEach(el=>{
      el.addEventListener("mousedown", (e)=>{
        if(e.button !== 0) return;
        e.preventDefault();
        const ctx = JSON.parse(el.dataset.ctx);
        const r = el.getBoundingClientRect();
        miDrag = { pid: ctx.pid, sidx: ctx.sidx, idx: ctx.idx, x0: r.left + r.width/2, y0: r.top + r.height/2 };
        const svg = $("#para-connect-svg", paragraphEl);
        if(svg && !svg.querySelector("#mi-drag-temp")){
          const temp = document.createElementNS("http://www.w3.org/2000/svg", "path");
          temp.setAttribute("id", "mi-drag-temp");
          temp.setAttribute("class", "para-conn-line para-conn-live");
          svg.appendChild(temp);
        }
        document.addEventListener("mousemove", onMiDragMove);
        document.addEventListener("mouseup", onMiDragUp, { once:true });
      });
    });
  }

  function onMiDragMove(e){
    if(!miDrag) return;
    const wrap = $("#para-connect-wrap", paragraphEl);
    const svg = $("#para-connect-svg", paragraphEl);
    if(!wrap || !svg) return;
    const wrapRect = wrap.getBoundingClientRect();
    const x1 = miDrag.x0 - wrapRect.left, y1 = miDrag.y0 - wrapRect.top;
    const x2 = e.clientX - wrapRect.left, y2 = e.clientY - wrapRect.top;
    const midY = (y1 + y2) / 2;
    const temp = svg.querySelector("#mi-drag-temp");
    if(temp) temp.setAttribute("d", `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`);
    $$(".mi-box-stack.mi-drop-target", paragraphEl).forEach(s=>s.classList.remove("mi-drop-target"));
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const stack = under && under.closest && under.closest(".mi-box-stack");
    if(stack){
      const w = stack.querySelector(".mi-box-wrap");
      const c = w && JSON.parse(w.dataset.ctx);
      if(c && c.pid===miDrag.pid && c.sidx!==miDrag.sidx) stack.classList.add("mi-drop-target");
    }
  }

  function onMiDragUp(e){
    document.removeEventListener("mousemove", onMiDragMove);
    const drag = miDrag;
    miDrag = null;
    $$(".mi-box-stack.mi-drop-target", paragraphEl).forEach(s=>s.classList.remove("mi-drop-target"));
    const svg = $("#para-connect-svg", paragraphEl);
    const temp = svg && svg.querySelector("#mi-drag-temp");
    if(temp) temp.remove();
    if(!drag) return;

    const under = document.elementFromPoint(e.clientX, e.clientY);
    const targetStack = under && under.closest && under.closest(".mi-box-stack");
    if(!targetStack) return;
    const targetWrap = targetStack.querySelector(".mi-box-wrap");
    if(!targetWrap) return;
    const targetCtx = JSON.parse(targetWrap.dataset.ctx);
    if(targetCtx.pid !== drag.pid || targetCtx.sidx === drag.sidx) return; // must land on a different sentence

    const p = getParagraph(drag.pid);
    if(!p) return;
    const srcBoxId = ensureBoxId(p, drag.sidx, drag.idx);
    const tgtBoxId = ensureBoxId(p, targetCtx.sidx, targetCtx.idx);
    if(!srcBoxId || !tgtBoxId) return;

    let a = { sidx: drag.sidx, boxId: srcBoxId }, b = { sidx: targetCtx.sidx, boxId: tgtBoxId };
    if(a.sidx > b.sidx){ const t=a; a=b; b=t; }
    const conns = (p.connections||[]).slice();
    const i = conns.findIndex(c=>c.aSidx===a.sidx && c.aBoxId===a.boxId && c.bSidx===b.sidx && c.bBoxId===b.boxId);
    if(i>=0) conns.splice(i,1);
    else conns.push({ aSidx:a.sidx, aBoxId:a.boxId, bSidx:b.sidx, bBoxId:b.boxId });
    updateParagraph(drag.pid, { sentences: p.sentences, connections: conns });
    // updateParagraph() skips the full re-render while a Main Idea box input is still focused
    // (userIsTypingInField), e.g. right after editing box text and then dragging a connect dot
    // without blurring first — that left the committed line never drawn. Redraw the SVG directly
    // here regardless, since drawing connections never needs to touch any text input's DOM.
    requestAnimationFrame(()=>redrawParaConnections(p));
  }

  function paraBoxHandleSelector(boxId, side){
    return `.mi-box-stack[data-box-id="${cssAttrEsc(boxId)}"] .mi-connect-${side}`;
  }

  function redrawParaConnections(p){
    const wrap = $("#para-connect-wrap", paragraphEl);
    const svg = $("#para-connect-svg", paragraphEl);
    if(!wrap || !svg) return;
    const w = wrap.scrollWidth, h = wrap.scrollHeight;
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const wrapRect = wrap.getBoundingClientRect();
    const paths = (p.connections||[]).map(c=>{
      // a is always the earlier sentence (smaller sidx): anchor from its BOTTOM dot down to the
      // later sentence's TOP dot, so the curve flows the same direction as the sketch (top-to-bottom).
      const aEl = wrap.querySelector(paraBoxHandleSelector(c.aBoxId, "bottom"));
      const bEl = wrap.querySelector(paraBoxHandleSelector(c.bBoxId, "top"));
      if(!aEl || !bEl) return "";
      const ar = aEl.getBoundingClientRect(), br = bEl.getBoundingClientRect();
      const x1 = ar.left - wrapRect.left + ar.width/2, y1 = ar.top - wrapRect.top + ar.height/2;
      const x2 = br.left - wrapRect.left + br.width/2, y2 = br.top - wrapRect.top + br.height/2;
      const midY = (y1+y2)/2;
      return `<path d="M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}" class="para-conn-line"/>`;
    }).join("");
    svg.innerHTML = paths;
  }

  function renderParaSentenceCard(p, sidx, number){
    const s = p.sentences[sidx];
    const tokens = tokenize(s.text);
    const sel = new Set(s.selected||[]);
    const splitAfter = new Set(s.selSplitAfter||[]);
    const sel2 = new Set(s.selSecondary||[]);
    const hideOriginal = !!state.paraRecap;
    const hideSimplified = !!state.paraHideSimplified;

    let headHtml;
    if(hideOriginal){
      headHtml = `<div class="para-sent-head"><div class="sent-num">${number}</div></div>`;
    } else {
      const tokHtml = buildTokHtml(tokens, sel, s.checked, i=>`data-pid="${esc(p.id)}" data-sidx="${sidx}" data-tidx="${i}"`, splitAfter, sel2);
      const checkBtn = (!s.checked && sel.size>0)
        ? `<button class="check-fab" data-pid="${esc(p.id)}" data-sidx="${sidx}" data-action="para-check" title="Simplify">&#10003;</button>`
        : "";
      const editBtn = s.checked ? editUndoBtnHtml(`data-pid="${esc(p.id)}" data-sidx="${sidx}" data-action="para-edit"`) : "";
      headHtml = `<div class="para-sent-head">
        <div class="sent-num">${number}</div>
        <div class="row1-line">${tokHtml}${checkBtn}${editBtn}</div>
      </div>`;
    }

    let simplifiedHtml = "", miHtml = "";
    if(s.checked){
      const runs = buildSelRuns(sel, splitAfter);
      if(hideSimplified){
        simplifiedHtml = "";
      } else {
        const chips = runs.map(run=>`<span class="sim-chip">${esc(stripChipPunct(run.map(i=>tokens[i]).join(" ")))}</span>`).join("");
        simplifiedHtml = `<div class="simplified-line"><span class="simplified-label">Simplified</span>${chips || '<span class="muted">(chưa bôi phần nào)</span>'}</div>`;
      }

      // Bake stable ids (and colors) onto this row's Main Idea boxes right now, at render time,
      // rather than lazily on first interaction: connectable rows need their DOM data-box-id to
      // always match what gets written into p.connections, even across a render that gets skipped
      // because an input is mid-edit (userIsTypingInField) — a later lazily-generated id would
      // otherwise mismatch the id already painted into the still-live DOM from this render.
      const boxes = bakeMiBoxIds(p, sidx);
      const topLinked = new Set(), bottomLinked = new Set();
      (p.connections||[]).forEach(c=>{
        bottomLinked.add(c.aBoxId);
        topLinked.add(c.bBoxId);
      });
      const miRowHtml = renderMiBoxRow({kind:"para", pid:p.id, sidx}, boxes, { connectable:true, topLinked, bottomLinked });
      // When Simplified is hidden, the "Main idea" label no longer needs its own line above the
      // boxes — put it inline, level with the boxes row, so this section takes less vertical space.
      miHtml = hideSimplified
        ? `<div class="mi-row-wrap mi-row-inline">
            <div class="mi-label-inline">Main idea</div>
            ${miRowHtml}
          </div>`
        : `<div class="mi-row-wrap">
            <div class="mi-label">Main idea</div>
            ${miRowHtml}
          </div>`;
    } else if(hideOriginal && !hideSimplified){
      simplifiedHtml = `<div class="simplified-line"><span class="muted">(câu này chưa simplify)</span></div>`;
    }

    // Note panel: same toolbar/editable as the Câu đơn tab's per-sentence Note, just addressed by
    // (paragraph id, sentence index) instead of a single-sentence id, and laid out beside the
    // sentence rather than under it. Always shown (even before the sentence is Simplified), so the
    // user can jot notes from the start -- hidden only when "Ẩn Simplified" is on, or in Linear Model
    // (a separate render path entirely). "Ẩn câu gốc" on its own leaves the Note alone.
    // Câu hỏi lẻ's "bài đọc" (p.isQa) deliberately has NO per-sentence Note -- keeps its rows compact;
    // it gets a single item-level Note box instead, rendered once below the whole item (see
    // renderParagraphDetail / renderQaNoteSection).
    let noteHtml = "";
    if(!hideSimplified && !p.isQa){
      noteHtml = `<div class="para-sent-note">
        <div class="note-wrap">
          <div class="mi-label">Note</div>
          <div class="note-toolbar" data-pid="${esc(p.id)}" data-sidx="${sidx}">
            <button type="button" data-cmd="bold" title="Đậm"><b>B</b></button>
            <button type="button" data-cmd="italic" title="Nghiêng"><i>I</i></button>
            <button type="button" data-cmd="underline" title="Gạch chân"><u>U</u></button>
            <span class="note-toolbar-break"></span>
            <button type="button" data-cmd="highlight" data-hl="pink" title="Highlight hồng"><span class="hl-swatch hl-pink"></span></button>
            <button type="button" data-cmd="highlight" data-hl="yellow" title="Highlight vàng"><span class="hl-swatch hl-yellow"></span></button>
            <button type="button" data-cmd="highlight" data-hl="blue" title="Highlight xanh dương"><span class="hl-swatch hl-blue"></span></button>
            <button type="button" data-cmd="highlight" data-hl="green" title="Highlight xanh lá"><span class="hl-swatch hl-green"></span></button>
            <span class="note-toolbar-sep"></span>
            <button type="button" data-cmd="clearhl" title="Bỏ highlight">&#8416;</button>
          </div>
          <div class="note-editable" contenteditable="true" data-pid="${esc(p.id)}" data-sidx="${sidx}" data-placeholder="Ghi chú thêm cho câu này...">${sanitizeNoteHtml(s.noteHtml||'')}</div>
        </div>
      </div>`;
    }

    return `<div class="para-sent-row">
      <div class="para-sent-main">
        ${headHtml}
        ${simplifiedHtml}
        ${miHtml}
      </div>
      ${noteHtml}
    </div>`;
  }

  function renderParagraphDetail(p){
    const lm = !!state.paraLinearModel;
    let html = `<div class="para-back" id="para-back">&larr; Quay lại danh sách ${p.isQa ? 'câu hỏi lẻ' : 'đoạn'}</div>`;
    html += `<div class="row" style="justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
      <p class="muted" style="margin:0; max-width:480px;">
        Với từng câu: <b>bôi chọn</b> phần cốt lõi, bấm <b>&#10003;</b> để simplify, rồi điền <b>Main Idea</b>.
        ${p.isQa ? 'Riêng phần <b>Bài đọc</b> mới có chấm nối repeated info; phần <b>Câu hỏi</b> chỉ đọc cấu trúc.' : 'Mỗi ô <b>Main Idea</b> có 1 chấm tròn ở trên và dưới (hiện khi hover) — kéo từ 1 chấm thả vào ô Main Idea của câu khác để nối <b>repeated info</b>; kéo lại lần nữa vào đúng cặp đó để huỷ nối.'}
      </p>
      <div class="row" style="gap:8px; flex-wrap:wrap;">
        ${lm ? "" : `<button class="eye-btn ${state.paraRecap?'active':''}" id="para-recap-toggle">${eyeIcon(!state.paraRecap)} ${state.paraRecap?'Đang ẩn câu gốc':'Ẩn câu gốc'}</button>`}
        ${lm ? "" : `<button class="eye-btn ${state.paraHideSimplified?'active':''}" id="para-hide-simplified-toggle">${eyeIcon(!state.paraHideSimplified)} ${state.paraHideSimplified?'Đang ẩn Simplified':'Ẩn Simplified'}</button>`}
        <button class="eye-btn ${lm?'active':''}" id="para-linear-model-toggle">${lm?'Thoát Linear Model':'Linear Model'}</button>
        ${state.downloads ? `<button class="ghost" id="para-export-btn">Xuất file HTML</button>` : ``}
      </div>
    </div>`;

    if(lm){
      html += p.isQa ? renderQaLinearModel(p) : renderParaLinearModel(p);
      return html;
    }

    // Câu hỏi lẻ + "Ẩn Simplified": sentences (either half) with no Main Idea text typed in yet
    // just clutter the comparison, so they disappear entirely while this is on -- leaving only the
    // sentences that DO carry a Main Idea, plus the final "Main Idea (cả đoạn)" row, which always stays.
    // Normal "Thêm đoạn văn" paragraphs are untouched: there, "Ẩn Simplified" only hides the Simplified
    // line (see renderParaSentenceCard), never a whole sentence row.
    const hideSimplified = !!state.paraHideSimplified;
    const passageIdxs = (p.sentences||[]).map((s,i)=>i)
      .filter(i => !(p.isQa && hideSimplified) || sentenceHasMiText(p.sentences[i]));

    if(p.isQa) html += `<div class="qa-section-label">Bài đọc</div>`;
    html += `<div id="para-connect-wrap" style="position:relative;">`;
    html += `<svg id="para-connect-svg" class="para-connect-svg"></svg>`;
    passageIdxs.forEach(i=>{
      html += renderParaSentenceCard(p, i, i+1);
    });

    const finalRowHtml = renderMiBoxRow({kind:"final", pid:p.id}, p.finalMainIdea);
    html += `<div class="para-final-wrap">
      <div class="para-final-label">Main Idea (cả đoạn)</div>
      ${finalRowHtml}
    </div>`;
    html += `</div>`;

    if(p.isQa){
      const questionIdxs = (p.questionSentences||[]).map((s,i)=>i)
        .filter(i => !hideSimplified || sentenceHasMiText(p.questionSentences[i]));
      html += `<div class="qa-question-section">
        <div class="qa-section-label">Câu hỏi</div>
        ${questionIdxs.map(i=>renderQaQuestionCard(p, i, i+1)).join("")}
      </div>`;
      html += renderQaNoteSection(p);
    }
    return html;
  }

  function sentenceHasMiText(s){
    return normMiBoxes(s && s.mainIdeaBoxes).some(b=>(b.text||"").trim().length>0);
  }

  // Câu hỏi lẻ's Linear Model: instead of the normal column-aligned grid of every passage sentence's
  // Main Idea (which has no "repeated info" concept to line up here), show just the two things worth
  // comparing side by side -- the passage's overall Main Idea and the question's own Main Idea.
  function renderQaLinearModel(p){
    const finalBoxes = normMiBoxes(p.finalMainIdea).filter(b=>(b.text||"").trim());
    const finalHtml = finalBoxes.length
      ? finalBoxes.map(b=>`<span class="lm-pill ${esc(b.color)}">${esc(b.text)}</span>`).join("")
      : `<span class="muted">(chưa điền)</span>`;
    const qBoxes = [];
    (p.questionSentences||[]).forEach(s=>{
      normMiBoxes(s.mainIdeaBoxes).forEach(b=>{ if((b.text||"").trim()) qBoxes.push(b); });
    });
    const qHtml = qBoxes.length
      ? qBoxes.map(b=>`<span class="lm-pill ${esc(b.color)}">${esc(b.text)}</span>`).join("")
      : `<span class="muted">(chưa điền)</span>`;
    return `<div class="qa-lm-wrap">
      <div class="qa-lm-row">
        <div class="qa-lm-label">Main Idea (cả bài đọc)</div>
        <div class="qa-lm-boxes">${finalHtml}</div>
      </div>
      <div class="qa-lm-row">
        <div class="qa-lm-label">Main Idea (câu hỏi)</div>
        <div class="qa-lm-boxes">${qHtml}</div>
      </div>
    </div>`;
  }

  // Câu hỏi lẻ's Note: ONE box per item (not per sentence), sitting full-width right below the whole
  // item -- straddling both the "Bài đọc" and "Câu hỏi" sections above it rather than living beside
  // either one. Same toolbar/editable/sanitize machinery as the per-sentence Note elsewhere, just
  // addressed by paragraph id alone (no sidx) via p.qaNoteHtml.
  function renderQaNoteSection(p){
    return `<div class="qa-note-section">
      <div class="mi-label">Note</div>
      <div class="note-toolbar qa-note-toolbar" data-pid="${esc(p.id)}">
        <button type="button" data-cmd="bold" title="Đậm"><b>B</b></button>
        <button type="button" data-cmd="italic" title="Nghiêng"><i>I</i></button>
        <button type="button" data-cmd="underline" title="Gạch chân"><u>U</u></button>
        <span class="note-toolbar-break"></span>
        <button type="button" data-cmd="highlight" data-hl="pink" title="Highlight hồng"><span class="hl-swatch hl-pink"></span></button>
        <button type="button" data-cmd="highlight" data-hl="yellow" title="Highlight vàng"><span class="hl-swatch hl-yellow"></span></button>
        <button type="button" data-cmd="highlight" data-hl="blue" title="Highlight xanh dương"><span class="hl-swatch hl-blue"></span></button>
        <button type="button" data-cmd="highlight" data-hl="green" title="Highlight xanh lá"><span class="hl-swatch hl-green"></span></button>
        <span class="note-toolbar-sep"></span>
        <button type="button" data-cmd="clearhl" title="Bỏ highlight">&#8416;</button>
      </div>
      <div class="note-editable qa-note-editable" contenteditable="true" data-pid="${esc(p.id)}" data-placeholder="Ghi chú thêm cho câu hỏi này...">${sanitizeNoteHtml(p.qaNoteHtml||'')}</div>
    </div>`;
  }

  // Câu hỏi lẻ's "Câu hỏi" half: structure-only (simplify + Main Idea box per sentence), no
  // cross-sentence connections and no Note panel -- modeled on renderParaSentenceCard's head/Simplified/
  // Main-idea markup, addressed via ctx.kind:"qaQuestion" (see getBoxesArr/setBoxesArr) instead of "para".
  // data-qside="q" on every token/button is the one thing that tells these apart from the passage's own
  // tokens when both carry the same data-pid/data-sidx (see altDragScopeFor and the wiring below).
  function renderQaQuestionCard(p, sidx, number){
    const s = (p.questionSentences||[])[sidx] || {};
    const tokens = tokenize(s.text||"");
    const sel = new Set(s.selected||[]);
    const splitAfter = new Set(s.selSplitAfter||[]);
    const sel2 = new Set(s.selSecondary||[]);
    const tokHtml = buildTokHtml(tokens, sel, s.checked, i=>`data-pid="${esc(p.id)}" data-sidx="${sidx}" data-tidx="${i}" data-qside="q"`, splitAfter, sel2);
    const checkBtn = (!s.checked && sel.size>0)
      ? `<button class="check-fab" data-pid="${esc(p.id)}" data-sidx="${sidx}" data-qside="q" data-action="qa-q-check" title="Simplify">&#10003;</button>`
      : "";
    const editBtn = s.checked ? editUndoBtnHtml(`data-pid="${esc(p.id)}" data-sidx="${sidx}" data-qside="q" data-action="qa-q-edit"`) : "";
    let miHtml = "";
    if(s.checked){
      const runs = buildSelRuns(sel, splitAfter);
      const chips = runs.map(run=>`<span class="sim-chip">${esc(stripChipPunct(run.map(i=>tokens[i]).join(" ")))}</span>`).join("");
      const simplifiedHtml = `<div class="simplified-line"><span class="simplified-label">Simplified</span>${chips || '<span class="muted">(chưa bôi phần nào)</span>'}</div>`;
      const boxes = normMiBoxes(s.mainIdeaBoxes);
      const miRowHtml = renderMiBoxRow({kind:"qaQuestion", pid:p.id, sidx}, boxes);
      miHtml = simplifiedHtml + `<div class="mi-row-wrap"><div class="mi-label">Main idea</div>${miRowHtml}</div>`;
    }
    return `<div class="qa-q-row">
      <div class="para-sent-head">
        <div class="sent-num">${number}</div>
        <div class="row1-line">${tokHtml}${checkBtn}${editBtn}</div>
      </div>
      ${miHtml}
    </div>`;
  }

  // ---------- Linear Model: compact column-aligned grid of Main Idea boxes ----------
  // Column = Main Idea box position (same thing as its color, since color is assigned by position):
  // Column = which REPEATED-INFO GROUP a box belongs to (via p.connections), not its position in the
  // sentence: two boxes the user linked with a dashed connection -- however far apart their original
  // positions were -- are pulled into the exact same vertical column, so the repeated idea reads as one
  // straight line down the page. A box with no connection at all just gets its own column. Column order
  // follows first appearance, reading top-to-bottom / left-to-right through the sentences.
  function renderParaLinearModel(p){
    const rows = [];
    (p.sentences||[]).forEach((s,sidx)=>{
      if(!s.checked) return;
      const boxes = bakeMiBoxIds(p, sidx).filter(b=>(b.text||"").trim());
      if(boxes.length) rows.push({ number: sidx+1, boxes });
    });

    if(rows.length===0){
      return `<div class="empty-state">Chưa có câu nào được simplify + điền Main Idea để xếp vào Linear Model.</div>`;
    }

    // union-find over box ids, merged by p.connections
    const parent = {};
    function find(x){
      parent[x] = (parent[x]===undefined) ? x : parent[x];
      while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; }
      return x;
    }
    function union(a,b){ const ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; }
    rows.forEach(r=>r.boxes.forEach(b=>{ find(b.id); }));
    (p.connections||[]).forEach(c=>{
      if(parent[c.aBoxId]===undefined) parent[c.aBoxId]=c.aBoxId;
      if(parent[c.bBoxId]===undefined) parent[c.bBoxId]=c.bBoxId;
      union(c.aBoxId, c.bBoxId);
    });

    // assign each group a column, in order of first appearance
    const colOfRoot = new Map();
    rows.forEach(r=>r.boxes.forEach(b=>{
      const root = find(b.id);
      if(!colOfRoot.has(root)) colOfRoot.set(root, colOfRoot.size);
    }));
    const colCount = Math.max(1, colOfRoot.size);

    const rowsHtml = rows.map(row=>{
      const cellsByCol = new Array(colCount).fill(null);
      row.boxes.forEach(b=>{
        const col = colOfRoot.get(find(b.id));
        if(cellsByCol[col]===null) cellsByCol[col] = b;
      });
      let cellsHtml = `<div class="lm-num">${row.number}</div>`;
      for(let col=0; col<colCount; col++){
        const b = cellsByCol[col];
        cellsHtml += b
          ? `<div class="lm-cell"><span class="lm-pill ${esc(b.color)}" data-box-id="${esc(b.id)}">${esc(b.text)}</span></div>`
          : `<div class="lm-cell"></div>`;
      }
      return cellsHtml;
    }).join("");

    const finalRowHtml = renderMiBoxRow({kind:"final", pid:p.id}, p.finalMainIdea);

    return `<div class="lm-wrap" id="para-linear-wrap" style="position:relative;">
      <svg id="para-linear-svg" class="para-connect-svg lm-connect-svg"></svg>
      <div class="lm-grid" style="grid-template-columns: 26px repeat(${colCount}, minmax(70px, max-content));">
        ${rowsHtml}
      </div>
      <div class="para-final-wrap lm-final-wrap">
        <div class="para-final-label">Main Idea (cả đoạn)</div>
        ${finalRowHtml}
      </div>
    </div>`;
  }

  // Linear Model: the "Main Idea (cả đoạn)" row lives in its own flex container below the grid (so it
  // keeps its own "+"/remove UI), but box i is meant to read as belonging to idea-color column i above
  // it. .lm-grid and that row size their own columns independently (each one's minmax(70px,max-content)
  // track fits only ITS OWN content), so the two can end up with different column widths and drift out
  // of alignment -- there's no reliable way to force two separate CSS Grids to agree on track widths
  // from markup alone. Instead, once both are on screen, this measures each grid column's actual
  // rendered left edge (from the always-present, possibly-empty .lm-cell for that column) and
  // absolutely positions each final box so it's centered under its column, then -- since columns can
  // sit closer together than a box is wide -- nudges any boxes that would overlap apart (left one
  // further left, right one further right) around their shared midpoint, so there's always a gap.
  // Also draws one straight, centered, dashed line per column (the normal drag-to-connect curved lines
  // in redrawParaConnections are untouched) running from the top of the grid down through every pill in
  // that column -- intentionally over the boxes/text -- to the matching aligned final box, ending in a
  // downward arrowhead pointing into it.
  function redrawLinearModelConnections(p){
    const wrap = $("#para-linear-wrap", paragraphEl);
    const svg = $("#para-linear-svg", paragraphEl);
    const grid = $(".lm-grid", paragraphEl);
    const finalBoxesWrap = $(".lm-final-wrap .mi-boxes", paragraphEl);
    if(!wrap || !svg || !grid || !finalBoxesWrap) return;

    const numRows = $$(".lm-num", paragraphEl).length;
    const cells = $$(".lm-cell", paragraphEl);
    const colCount = numRows ? Math.round(cells.length / numRows) : 0;
    const finalBoxes = $$(".mi-box-wrap", finalBoxesWrap);
    const LM_FINAL_BOX_GAP = 10; // minimum breathing room enforced between two adjacent final boxes
    const LM_FINAL_BOX_MIN_W = 56; // never shrink a box below this, even for very short text
    const LM_FINAL_BOX_PAD = 24; // matches .mi-box's left+right padding (12px each side)

    // Size one final box: always a single line (never wrapped onto a second line), at the SAME
    // font-size as the regular (per-sentence) Main Idea boxes above -- the box's width simply grows
    // to fully contain whatever the text needs, rather than shrinking the font to fit a cap.
    function sizeFinalBox(input){
      const span = ensureMeasureSpan();
      const cs = getComputedStyle(input);
      span.style.fontFamily = cs.fontFamily;
      span.style.fontWeight = cs.fontWeight;
      span.style.fontSize = cs.fontSize;
      span.textContent = input.value || input.getAttribute("placeholder") || "";
      const textW = Math.ceil(span.getBoundingClientRect().width);
      return Math.max(LM_FINAL_BOX_MIN_W, textW + LM_FINAL_BOX_PAD);
    }

    // Align: center each final box (up to colCount of them) under column i, using row 0's cell for
    // that column as the measurement anchor (always present, even when empty, since every row renders
    // a placeholder .lm-cell per column). Columns can sit closer together than a box is wide, so a
    // second pass below nudges any boxes that would still overlap apart from their shared midpoint,
    // using each box's own (possibly different) width rather than one fixed width for all of them.
    const finalWrapRect = finalBoxesWrap.getBoundingClientRect();
    const centers = [];
    const widths = [];
    finalBoxes.forEach((box, i)=>{
      if(i >= colCount || !cells[i]){ centers.push(null); widths.push(null); return; }
      const cr = cells[i].getBoundingClientRect();
      centers.push(cr.left - finalWrapRect.left + cr.width/2);
      const input = box.querySelector(".mi-box");
      widths.push(input ? sizeFinalBox(input) : LM_FINAL_BOX_MIN_W);
    });
    const activeIdx = centers.map((c,i)=>c===null ? -1 : i).filter(i=>i!==-1);
    for(let pass=0; pass<6; pass++){
      for(let k=0; k<activeIdx.length-1; k++){
        const i = activeIdx[k], j = activeIdx[k+1];
        const minDist = (widths[i] + widths[j]) / 2 + LM_FINAL_BOX_GAP;
        const dist = centers[j] - centers[i];
        if(dist < minDist){
          const shift = (minDist - dist) / 2;
          centers[i] -= shift; centers[j] += shift;
        }
      }
    }
    let maxBoxH = 0;
    finalBoxes.forEach((box, i)=>{
      if(!activeIdx.includes(i)){ box.style.position = ""; box.style.left = ""; box.style.top = ""; return; }
      const input = box.querySelector(".mi-box");
      if(input){ input.style.width = widths[i] + "px"; }
      box.style.position = "absolute";
      box.style.left = (centers[i] - widths[i]/2) + "px";
      box.style.top = "0px";
      maxBoxH = Math.max(maxBoxH, box.offsetHeight);
    });
    finalBoxesWrap.style.position = "relative";
    finalBoxesWrap.style.minHeight = maxBoxH ? maxBoxH + "px" : "";
    // The "+" button is the one child left in normal flow once the boxes go absolute -- place it right
    // after the last aligned box instead of letting it collapse to the container's top-left corner.
    const addBtn = $(".mi-add", finalBoxesWrap);
    const lastAlignedBox = finalBoxes[Math.min(finalBoxes.length, colCount) - 1];
    if(addBtn && lastAlignedBox){
      const lr = lastAlignedBox.getBoundingClientRect();
      addBtn.style.position = "absolute";
      addBtn.style.left = (lr.left - finalWrapRect.left + lr.width + 10) + "px";
      addBtn.style.top = "0px";
    } else if(addBtn){
      addBtn.style.position = "";
      addBtn.style.left = "";
      addBtn.style.top = "";
    }

    // Draw: one dashed vertical line per column, from the top of the grid down to its aligned final
    // box, ending in an arrowhead pointing into that box.
    const w = wrap.scrollWidth, h = wrap.scrollHeight;
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const wrapRect = wrap.getBoundingClientRect();
    const gridRect = grid.getBoundingClientRect();
    const defs = `<defs><marker id="lmArrow" markerWidth="8" markerHeight="8" refX="3.5" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="var(--accent)"/></marker></defs>`;
    const lines = [];
    for(let col=0; col<colCount; col++){
      const finalEl = finalBoxes[col];
      if(!finalEl) continue; // no matching final box for this column -- nothing to point to, skip the line
      const fr = finalEl.getBoundingClientRect();
      const x = fr.left - wrapRect.left + fr.width/2;
      const y1 = gridRect.top - wrapRect.top;
      const y2 = fr.top - wrapRect.top - 2;
      lines.push(`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" class="lm-col-line" marker-end="url(#lmArrow)"/>`);
    }
    svg.innerHTML = defs + lines.join("");
  }

  // The "Database" screen's item cards: the paragraph/qa add-form plus the full list of items for
  // the current tab (state.paraMode), each with a checkbox for multi-select. This is the OLD
  // renderParagraphList()/renderQaList() body (unchanged markup/behaviour for open/delete), with
  // checkboxes and a "Tạo phiên làm việc" button added. `scopeIds`, when given, filters which items
  // are shown (used by the session work screen below instead of the Database screen).
  function renderParagraphList(){
    if(state.paraMode === "qa") return renderQaList();
    let html = `<p class="intro">Dán một <b>đoạn văn</b> (nhiều câu), app sẽ tách thành từng câu để bạn đọc cấu trúc, rồi nối Read Connections giữa các câu.</p>`;
    const paraImgPreview = state.paraBulkFiles.map(f=>`<img class="bulk-thumb" src="${URL.createObjectURL(f)}" alt="${esc(f.name)}">`).join("");
    html += `<div class="card stack" style="margin-bottom:16px;">
      <label class="field">Dán đoạn văn (tiếng Anh)
        <textarea id="para-new-text" rows="7" placeholder="Dán nguyên đoạn văn vào đây...">${esc(state.paraDraftText||"")}</textarea>
      </label>
      <label class="field">Hoặc tải ảnh cả đoạn lên ${state.sample? '— mình sẽ đọc chữ trong ảnh và điền vào ô trên' : '(cần quyền dùng Claude ở đây)'}
        <input type="file" id="para-bulk-images" accept="image/png,image/jpeg,image/webp,image/gif" multiple ${state.sample? '' : 'disabled'}>
      </label>
      ${paraImgPreview ? `<div class="bulk-preview">${paraImgPreview}</div>` : ``}
      <div class="row" style="flex-wrap:wrap; gap:8px;">
        <button class="primary" id="para-new-submit">Tách câu &amp; bắt đầu</button>
        ${state.sample && state.paraBulkFiles.length ? `<button class="ghost" id="para-ocr-btn">Đọc chữ từ ảnh &amp; điền vào ô trên</button>` : ``}
      </div>
      <div id="para-ocr-status" class="status-line" hidden></div>
    </div>`;

    html += `<div class="stack" id="para-list">`;
    const normalParagraphs = state.paragraphs.filter(p=>!p.isQa);
    if(normalParagraphs.length===0){
      html += `<div class="empty-state">Chưa có đoạn văn nào.</div>`;
    } else {
      const chronological = normalParagraphs.slice().sort((a,b)=>(b.order||0)-(a.order||0));
      chronological.forEach(p=>{
        const n = (p.sentences||[]).length;
        html += `<div class="para-item" data-id="${esc(p.id)}">
          <div class="prev">${esc((p.text||"").slice(0,220))}</div>
          <div class="row" style="gap:10px;">
            <div class="count">${n} câu</div>
            <button class="del-btn" data-action="para-delete" data-id="${esc(p.id)}" title="Xóa đoạn">&times;</button>
          </div>
        </div>`;
      });
    }
    html += `</div>`;
    return html;
  }

  // "Câu hỏi lẻ" list + add-form -- shares #para-list / .para-item / data-action="para-delete" markup
  // with the normal paragraph list above, so the existing open/delete wiring in wireParagraphView()
  // just works unchanged for these too; only the add-form (two textareas instead of one) differs.
  function renderQaList(){
    let html = `<p class="intro">Nhập <b>thông tin trong bài đọc</b> (một câu hoặc cả đoạn văn -- nếu là đoạn, app sẽ tách thành từng câu) và <b>câu hỏi</b> tương ứng. Bài đọc đọc được cả cấu trúc và Read Connections; câu hỏi chỉ đọc cấu trúc.</p>`;
    html += `<div class="card stack" style="margin-bottom:16px;">
      <label class="field">Thông tin trong bài đọc (câu đơn hoặc đoạn văn, tiếng Anh)
        <textarea id="qa-new-passage" rows="6" placeholder="Dán câu hoặc đoạn văn vào đây...">${esc(state.qaDraftPassageText||"")}</textarea>
      </label>
      <label class="field">Câu hỏi
        <textarea id="qa-new-question" rows="2" placeholder="Nhập câu hỏi vào đây...">${esc(state.qaDraftQuestionText||"")}</textarea>
      </label>
      <div class="row" style="flex-wrap:wrap; gap:8px;">
        <button class="primary" id="qa-new-submit">Tách câu &amp; bắt đầu</button>
      </div>
    </div>`;

    html += `<div class="stack" id="para-list">`;
    const qaItems = state.paragraphs.filter(p=>p.isQa);
    if(qaItems.length===0){
      html += `<div class="empty-state">Chưa có câu hỏi lẻ nào.</div>`;
    } else {
      qaItems.slice().sort((a,b)=>(b.order||0)-(a.order||0)).forEach(p=>{
        const qPreview = (p.questionSentences && p.questionSentences.map(s=>s.text).join(" ")) || "";
        html += `<div class="para-item" data-id="${esc(p.id)}">
          <div class="prev">${esc((p.text||"").slice(0,180))}</div>
          <div class="prev" style="opacity:.7; margin-top:4px;">${esc(qPreview.slice(0,180))}</div>
          <div class="row" style="gap:10px;">
            <div class="count">${(p.sentences||[]).length} câu bài đọc</div>
            <button class="del-btn" data-action="para-delete" data-id="${esc(p.id)}" title="Xóa">&times;</button>
          </div>
        </div>`;
      });
    }
    html += `</div>`;
    return html;
  }

  function renderParagraphView(){
    const savedFocus = captureFocus();
    const p = state.currentParagraphId ? getParagraph(state.currentParagraphId) : null;
    let html, drewDetail = false;
    if(p){
      // renderParagraphDetail can throw on a paragraph whose stored data doesn't match what the
      // current code expects (e.g. an older/partial shape). Letting that exception escape here would
      // leave paragraphEl showing its previous (stale) HTML while state.currentParagraphId stays
      // pointed at this same broken paragraph — so every later render attempt (including opening or
      // deleting a *different*, perfectly fine paragraph) hits this same throw again, which looks
      // exactly like "nothing happens when I click open or delete". Fall back to a recoverable error
      // view instead, so the paragraph can always at least be backed out of or deleted.
      try{
        html = renderParagraphDetail(p);
        drewDetail = true;
      }catch(e){
        console.error("renderParagraphDetail failed for paragraph", p.id, e);
        html = renderParagraphError(p, e);
      }
    } else {
      html = renderParagraphList();
    }
    if(!p) state.currentParagraphId = null;
    paragraphEl.innerHTML = html;
    wireParagraphView();
    restoreFocus(savedFocus);
    if(p && drewDetail){
      requestAnimationFrame(()=> state.paraLinearModel ? redrawLinearModelConnections(p) : redrawParaConnections(p));
    }
  }

  function renderParagraphError(p, err){
    return `<div class="para-back" id="para-back">&larr; Quay lại danh sách đoạn</div>
      <div class="empty-state" style="text-align:left;">
        Đoạn này đang bị lỗi dữ liệu nên không hiển thị được (${esc(err && err.message || String(err))}).
        Bạn có thể xóa đoạn này rồi dán lại đoạn văn để làm lại.
        <div class="row" style="margin-top:12px;">
          <button class="ghost" data-action="para-delete" data-id="${esc(p.id)}">Xóa đoạn này</button>
        </div>
      </div>`;
  }

  function wireParagraphView(){
    const submitBtn = $("#para-new-submit", paragraphEl);
    if(submitBtn){
      submitBtn.onclick = ()=>{
        const ta = $("#para-new-text", paragraphEl);
        addParagraph(ta ? ta.value : "");
      };
    }
    const paraDraftTa = $("#para-new-text", paragraphEl);
    if(paraDraftTa){
      paraDraftTa.oninput = ()=>{ state.paraDraftText = paraDraftTa.value; };
    }
    const paraImagesInput = $("#para-bulk-images", paragraphEl);
    if(paraImagesInput){
      paraImagesInput.onchange = ()=>{
        // snapshot the textarea's current (unsaved) draft before this re-render wipes the DOM, so
        // picking an image doesn't silently discard text the user already pasted/typed
        state.paraDraftText = paraDraftTa ? paraDraftTa.value : state.paraDraftText;
        state.paraBulkFiles = Array.from(paraImagesInput.files || []);
        renderParagraphView();
      };
    }
    const paraOcrBtn = $("#para-ocr-btn", paragraphEl);
    if(paraOcrBtn) paraOcrBtn.onclick = handleParaOcr;
    $$(".para-item", paragraphEl).forEach(el=>{
      el.onclick = (e)=>{
        if(e.target.closest("[data-action='para-delete']")) return;
        openParagraph(el.dataset.id);
      };
    });
    $$("[data-action='para-delete']", paragraphEl).forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); deleteParagraph(el.dataset.id); };
    });

    const backBtn = $("#para-back", paragraphEl);
    if(backBtn) backBtn.onclick = ()=>{ state.currentParagraphId = null; renderParagraphView(); };
    const recapToggle = $("#para-recap-toggle", paragraphEl);
    if(recapToggle) recapToggle.onclick = ()=>{
      state.paraRecap = !state.paraRecap;
      updateParagraph(state.currentParagraphId, { uiRecap: state.paraRecap });
    };
    const hideSimplifiedToggle = $("#para-hide-simplified-toggle", paragraphEl);
    if(hideSimplifiedToggle) hideSimplifiedToggle.onclick = ()=>{
      state.paraHideSimplified = !state.paraHideSimplified;
      updateParagraph(state.currentParagraphId, { uiHideSimplified: state.paraHideSimplified });
    };
    const linearModelToggle = $("#para-linear-model-toggle", paragraphEl);
    if(linearModelToggle) linearModelToggle.onclick = ()=>{
      state.paraLinearModel = !state.paraLinearModel;
      updateParagraph(state.currentParagraphId, { uiLinearModel: state.paraLinearModel });
    };
    const paraExportBtn = $("#para-export-btn", paragraphEl);
    if(paraExportBtn) paraExportBtn.onclick = ()=> handleExportParagraphHtml(state.currentParagraphId);

    $$(".para-sent-row .tok:not(.locked)", paragraphEl).forEach(el=>{
      el.onclick = (e)=>{
        if(e.altKey) return; // fully handled by the Option-drag mousedown/mouseup flow below
        const pid = el.dataset.pid, sidx = parseInt(el.dataset.sidx,10), tidx = parseInt(el.dataset.tidx,10);
        if(e.metaKey || e.ctrlKey){ toggleParaTokSplit(pid, sidx, tidx); }
        else { toggleParaTok(pid, sidx, tidx); }
      };
      el.onmousedown = (e)=>{
        if(e.altKey){ e.preventDefault(); startAltDrag(el); }
      };
    });
    $$(".para-sent-row .sel-run, .para-sent-row .sel2-run", paragraphEl).forEach(run=>{
      run.onclick = (e)=>{
        if(e.altKey) return;
        if(e.target.closest(".tok")) return; // already handled by that word's own click handler
        const best = nearestTokInRun(run, e.clientX);
        if(!best || best.classList.contains("locked")) return;
        const pid = best.dataset.pid, sidx = parseInt(best.dataset.sidx,10), tidx = parseInt(best.dataset.tidx,10);
        if(e.metaKey || e.ctrlKey){ toggleParaTokSplit(pid, sidx, tidx); }
        else { toggleParaTok(pid, sidx, tidx); }
      };
      run.onmousedown = (e)=>{
        if(!e.altKey || e.target.closest(".tok")) return;
        const best = nearestTokInRun(run, e.clientX);
        if(!best || best.classList.contains("locked")) return;
        e.preventDefault();
        startAltDrag(best);
      };
    });
    $$("[data-action='para-check']", paragraphEl).forEach(el=>{
      el.onclick = ()=> updateParaSentence(el.dataset.pid, parseInt(el.dataset.sidx,10), {checked:true});
    });
    $$("[data-action='para-edit']", paragraphEl).forEach(el=>{
      el.onclick = ()=> updateParaSentence(el.dataset.pid, parseInt(el.dataset.sidx,10), {checked:false});
    });

    // ---------- Câu hỏi lẻ: add-form + question half (structure-only, no connections) ----------
    const qaSubmitBtn = $("#qa-new-submit", paragraphEl);
    if(qaSubmitBtn){
      qaSubmitBtn.onclick = ()=>{
        const passTa = $("#qa-new-passage", paragraphEl);
        const qTa = $("#qa-new-question", paragraphEl);
        addQaParagraph(passTa ? passTa.value : "", qTa ? qTa.value : "");
      };
    }
    const qaPassageTa = $("#qa-new-passage", paragraphEl);
    if(qaPassageTa) qaPassageTa.oninput = ()=>{ state.qaDraftPassageText = qaPassageTa.value; };
    const qaQuestionTa = $("#qa-new-question", paragraphEl);
    if(qaQuestionTa) qaQuestionTa.oninput = ()=>{ state.qaDraftQuestionText = qaQuestionTa.value; };

    $$(".qa-q-row .tok:not(.locked)", paragraphEl).forEach(el=>{
      el.onclick = (e)=>{
        if(e.altKey) return;
        const pid = el.dataset.pid, sidx = parseInt(el.dataset.sidx,10), tidx = parseInt(el.dataset.tidx,10);
        if(e.metaKey || e.ctrlKey){ toggleQaQuestionTokSplit(pid, sidx, tidx); }
        else { toggleQaQuestionTok(pid, sidx, tidx); }
      };
      el.onmousedown = (e)=>{
        if(e.altKey){ e.preventDefault(); startAltDrag(el); }
      };
    });
    $$(".qa-q-row .sel-run, .qa-q-row .sel2-run", paragraphEl).forEach(run=>{
      run.onclick = (e)=>{
        if(e.altKey) return;
        if(e.target.closest(".tok")) return;
        const best = nearestTokInRun(run, e.clientX);
        if(!best || best.classList.contains("locked")) return;
        const pid = best.dataset.pid, sidx = parseInt(best.dataset.sidx,10), tidx = parseInt(best.dataset.tidx,10);
        if(e.metaKey || e.ctrlKey){ toggleQaQuestionTokSplit(pid, sidx, tidx); }
        else { toggleQaQuestionTok(pid, sidx, tidx); }
      };
      run.onmousedown = (e)=>{
        if(!e.altKey || e.target.closest(".tok")) return;
        const best = nearestTokInRun(run, e.clientX);
        if(!best || best.classList.contains("locked")) return;
        e.preventDefault();
        startAltDrag(best);
      };
    });
    $$("[data-action='qa-q-check']", paragraphEl).forEach(el=>{
      el.onclick = ()=> updateQaQuestionSentence(el.dataset.pid, parseInt(el.dataset.sidx,10), {checked:true});
    });
    $$("[data-action='qa-q-edit']", paragraphEl).forEach(el=>{
      el.onclick = ()=> updateQaQuestionSentence(el.dataset.pid, parseInt(el.dataset.sidx,10), {checked:false});
    });

    wireMiBoxRows(paragraphEl);

    wireMiConnectHandles(paragraphEl);

    $$(".para-sent-note .note-editable", paragraphEl).forEach(el=>{
      const flush = ()=>{
        clearTimeout(el._t);
        updateParaSentence(el.dataset.pid, parseInt(el.dataset.sidx,10), { noteHtml: sanitizeNoteHtml(el.innerHTML) });
      };
      el.oninput = ()=>{ clearTimeout(el._t); el._t = setTimeout(flush, 500); };
      el.onkeydown = (e)=>{ if(e.key==="Escape") e.target.blur(); };
      el.onblur = ()=>{ clearTimeout(el._t); setTimeout(flush, 0); };
      // Dragging the Note box's own resize handle changes this sentence row's height (and so where
      // every box below it sits) without going through a state update/re-render -- redraw the
      // connection curves straight off the live DOM whenever that happens, or they'd keep pointing at
      // the old positions.
      if(typeof ResizeObserver !== "undefined" && !state.paraLinearModel){
        // Called directly (no extra requestAnimationFrame hop): ResizeObserver callbacks already fire
        // after layout but before the next paint, so recomputing the curve right here, synchronously,
        // keeps it glued to the dots for every intermediate frame of the drag instead of trailing one
        // frame behind.
        const ro = new ResizeObserver(()=>{
          const p = getParagraph(state.currentParagraphId);
          if(p && !state.paraLinearModel) redrawParaConnections(p);
        });
        ro.observe(el);
      }
    });
    $$(".para-sent-note .note-toolbar button", paragraphEl).forEach(btn=>{
      btn.addEventListener("mousedown", (e)=>{ e.preventDefault(); }); // keep the editable's selection
      btn.addEventListener("click", ()=>{
        const toolbar = btn.closest(".note-toolbar");
        const pid = toolbar.dataset.pid, sidx = parseInt(toolbar.dataset.sidx,10);
        const editable = paragraphEl.querySelector(`.para-sent-note .note-editable[data-pid="${cssEsc(pid)}"][data-sidx="${sidx}"]`);
        if(!editable) return;
        editable.focus();
        const cmd = btn.dataset.cmd;
        if(cmd === "highlight"){
          const hlMap = { pink:"#ffcdf0", yellow:"#fff2a0", blue:"#bfe3ff", green:"#bdf0cf" };
          const color = hlMap[btn.dataset.hl] || hlMap.pink;
          document.execCommand("hiliteColor", false, color);
        } else if(cmd === "clearhl"){
          document.execCommand("hiliteColor", false, "transparent");
        } else {
          document.execCommand(cmd, false, null);
        }
        clearTimeout(editable._t);
        editable._t = setTimeout(()=>{
          updateParaSentence(pid, sidx, { noteHtml: sanitizeNoteHtml(editable.innerHTML) });
        }, 300);
      });
    });

    // Câu hỏi lẻ's single item-level Note (below both sections, not a per-sentence side panel) --
    // same pattern as the per-sentence Note above, just addressed by pid alone and written to
    // p.qaNoteHtml instead of a sentence's noteHtml.
    $$(".qa-note-editable", paragraphEl).forEach(el=>{
      const flush = ()=>{
        clearTimeout(el._t);
        updateParagraph(el.dataset.pid, { qaNoteHtml: sanitizeNoteHtml(el.innerHTML) });
      };
      el.oninput = ()=>{ clearTimeout(el._t); el._t = setTimeout(flush, 500); };
      el.onkeydown = (e)=>{ if(e.key==="Escape") e.target.blur(); };
      el.onblur = ()=>{ clearTimeout(el._t); setTimeout(flush, 0); };
    });
    $$(".qa-note-toolbar button", paragraphEl).forEach(btn=>{
      btn.addEventListener("mousedown", (e)=>{ e.preventDefault(); });
      btn.addEventListener("click", ()=>{
        const toolbar = btn.closest(".note-toolbar");
        const pid = toolbar.dataset.pid;
        const editable = paragraphEl.querySelector(`.qa-note-editable[data-pid="${cssEsc(pid)}"]`);
        if(!editable) return;
        editable.focus();
        const cmd = btn.dataset.cmd;
        if(cmd === "highlight"){
          const hlMap = { pink:"#ffcdf0", yellow:"#fff2a0", blue:"#bfe3ff", green:"#bdf0cf" };
          const color = hlMap[btn.dataset.hl] || hlMap.pink;
          document.execCommand("hiliteColor", false, color);
        } else if(cmd === "clearhl"){
          document.execCommand("hiliteColor", false, "transparent");
        } else {
          document.execCommand(cmd, false, null);
        }
        clearTimeout(editable._t);
        editable._t = setTimeout(()=>{
          updateParagraph(pid, { qaNoteHtml: sanitizeNoteHtml(editable.innerHTML) });
        }, 300);
      });
    });
  }

  boot();
})();
</script>
